[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "company-core"
version = "0.1.0"
description = "Self-hosted AI company operations, sales, and marketing control plane"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "openhands-sdk>=1.40,<2",
  "openhands-tools>=1.40,<2",
  "pydantic>=2.10,<3",
  "pydantic-ai>=1,<3",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.18,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "app*", "core*", "services*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Start with correctness checks; broad formatting is intentionally a separate migration.
select = ["E9", "F63", "F7", "F82"]
