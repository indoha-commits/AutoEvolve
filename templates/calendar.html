<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book With {{ company_name }}</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef3fb;
      --panel: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #d9e1ec;
      --accent: #5E6AD2;
      --accent-dark: #4957c6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      color: var(--text);
      font-family: Arial, sans-serif;
    }
    .shell { max-width: 1240px; margin: 0 auto; padding: 28px 18px 48px; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      margin-bottom: 18px; flex-wrap: wrap;
    }
    .brand { width: 160px; height: auto; display: block; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 12px 16px; border-radius: 12px; background: var(--accent);
      color: #fff; text-decoration: none; font-weight: 700;
    }
    .ghost { background: #fff; color: var(--text); border: 1px solid var(--line); }
    .panel {
      background: var(--panel); border: 1px solid var(--line); border-radius: 24px;
      overflow: hidden; box-shadow: 0 22px 65px rgba(17, 24, 39, 0.08);
    }
    .intro { padding: 24px 24px 10px; }
    .eyebrow {
      color: var(--accent); font-size: 12px; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px;
    }
    h1 { margin: 0 0 10px; font-size: 30px; line-height: 1.2; }
    p { margin: 0 0 14px; font-size: 15px; line-height: 1.7; color: var(--muted); }
    .frame { border-top: 1px solid var(--line); background: #fff; min-height: 860px; }
    iframe { width: 100%; min-height: 860px; border: 0; display: block; }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <img class="brand" src="{{ company_logo_url }}" alt="{{ company_name }}">
      <div class="actions">
        <a class="btn ghost" href="/meet">Back to meeting page</a>
        <a class="btn" href="{{ calendar_booking_url }}" target="_blank" rel="noreferrer">Open in new tab</a>
      </div>
    </div>
    <section class="panel">
      <div class="intro">
        <div class="eyebrow">Cal.diy Booking</div>
        <h1>Book your operations review</h1>
        <p>This page stays on your company domain while embedding the configured booking flow. If the embed fails, open the booking page directly.</p>
      </div>
      <div class="frame">
        <iframe src="{{ calendar_embed_url }}" title="{{ company_name }} booking calendar"></iframe>
      </div>
    </section>
  </main>
</body>
</html>
