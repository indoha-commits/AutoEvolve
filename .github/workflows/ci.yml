name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check app core services agents tools tests
      - run: python -m pytest
      - run: make setup-engines PYTHON=python
      - run: engines/g1/.venv/bin/python -m unittest discover -s engines/g1/tests
      - run: engines/g2/.venv/bin/python -m unittest discover -s engines/g2/tests
      - run: engines/g3/.venv/bin/python -m unittest discover -s engines/g3/tests
